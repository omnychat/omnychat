services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  omnychat:
    build: .
    ports:
      - "8080:8080"
    environment:
      OMNYCHAT_HTTP_ADDR: ":8080"
      OMNYCHAT_DB_PATH: /data/omnychat.db
      OMNYCHAT_JWT_SECRET: ${OMNYCHAT_JWT_SECRET:-dev-secret-change-me}
      OMNYCHAT_ALLOWED_ORIGINS: "*"
      OMNYCHAT_REDIS_URL: redis://redis:6379/0
      OMNYCHAT_WEBHOOK_URL: ${OMNYCHAT_WEBHOOK_URL:-}
      OMNYCHAT_WEBHOOK_SECRET: ${OMNYCHAT_WEBHOOK_SECRET:-}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
