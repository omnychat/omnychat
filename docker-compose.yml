services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  omnichat:
    build: .
    ports:
      - "8080:8080"
    environment:
      OMNICHAT_HTTP_ADDR: ":8080"
      OMNICHAT_DB_PATH: /data/omnichat.db
      OMNICHAT_JWT_SECRET: ${OMNICHAT_JWT_SECRET:-dev-secret-change-me}
      OMNICHAT_ALLOWED_ORIGINS: "*"
      OMNICHAT_REDIS_URL: redis://redis:6379/0
      OMNICHAT_WEBHOOK_URL: ${OMNICHAT_WEBHOOK_URL:-}
      OMNICHAT_WEBHOOK_SECRET: ${OMNICHAT_WEBHOOK_SECRET:-}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
